<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario GET JSON</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }

        pre {
            background-color: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Consultar Persona - GET JSON</h1>
        
        <form id="formulario">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" required>
            </div>
            
            <button type="submit">Consultar</button>
        </form>
        
        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById('formulario').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const apellidos = document.getElementById('apellidos').value;
            
            const url = `http://localhost/tecweb/practicas/p14/slim_v4/testjson?nombre=${encodeURIComponent(nombre)}&apellidos=${encodeURIComponent(apellidos)}`;
            
            fetch(url)
            .then(response => response.json())
            .then(data => {
                let resultadoDiv = document.getElementById('resultado');
                resultadoDiv.innerHTML = `
                    <h2>Respuesta JSON:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                resultadoDiv.style.display = 'block';
            })
            .catch(error => {
                document.getElementById('resultado').innerHTML = 
                    '<p style="color: red;">Error: ' + error + '</p>';
                document.getElementById('resultado').style.display = 'block';
            });
        });
    </script>
</body>
</html>
